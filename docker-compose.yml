services:
  frontend:
    build: ./frontend
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - backend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - 3000:3000
    depends_on:
      - db
      - redis

  ai_service:
    build: ./ai_service
    env_file:
     - ./ai_service/.env
    ports:
      - 0.0.0.0:8000:8000

  crawler:
    build: ./crawler
    env_file:
     - ./crawler/.env
    ports:
      - 0.0.0.0:8001:8001
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: RecruitmentDB
    ports:
      - 5432:5432

volumes:
    pgdata:
